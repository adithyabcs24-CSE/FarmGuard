<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LocalServe</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="navbar-root"></div>

  <main class="container" style="max-width: 480px; margin-top: 2rem;">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 0.25rem;">Welcome Back</h2>
      <p class="subtitle" style="text-align: center; margin-bottom: 1.5rem;">Log in to access your LocalServe account</p>

      <div id="alert-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="login-btn">
          Log In
        </button>
      </form>

      <div class="demo-accounts">
        <strong>⚡ Demo Quick Login:</strong>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem;">
          <button type="button" class="demo-btn" onclick="fillDemo('alice@example.com', 'password123')">
            Customer (Alice)
          </button>
          <button type="button" class="demo-btn" onclick="fillDemo('ramesh.plumber@example.com', 'password123')">
            Provider (Ramesh)
          </button>
          <button type="button" class="demo-btn" onclick="fillDemo('admin@localserve.com', 'admin123')">
            Admin
          </button>
        </div>
      </div>

      <p style="text-align: center; font-size: 0.9rem; margin-top: 1.5rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
      </p>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script>
    // Redirect if already authenticated
    auth.redirectIfLoggedIn();

    function fillDemo(email, pwd) {
      document.getElementById("email").value = email;
      document.getElementById("password").value = pwd;
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("expired")) {
      document.getElementById("alert-box").innerHTML = `
        <div class="alert alert-danger">Your session has expired. Please log in again.</div>
      `;
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("alert-box");
      const submitBtn = document.getElementById("login-btn");
      alertBox.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await api.post("/api/auth/login", { email, password });
        auth.setAuth(res.access_token, res.user);

        // Redirect based on role or URL redirect param
        const redirectParam = urlParams.get("redirect");
        if (redirectParam) {
          window.location.href = redirectParam;
        } else if (res.user.role === "provider") {
          window.location.href = "/provider_dashboard.html";
        } else {
          window.location.href = "/customer_dashboard.html";
        }
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger">${err.message || "Failed to log in"}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
